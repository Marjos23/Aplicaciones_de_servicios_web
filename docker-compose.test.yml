services:
  postgres-test:
    image: postgres:17
    container_name: coursehub_test_db
    restart: 'no'
    environment:
      POSTGRES_DB: coursehub-api-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coursehub-api-test']
      interval: 2s
      timeout: 3s
      retries: 15
